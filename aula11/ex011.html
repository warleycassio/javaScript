
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pais </title>
</head>
<body>
    <h1>Sistema qual e seu pais </h1>
    Seu Pais e :<input type="Text" name="txtvel" id="txtvel"> KM/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">

    </div>
    <script>
        
        function calcular() {
             var txtv = window.document.querySelector('input#txtvel')
            var res = window.document.querySelector('div#res')
           var pais = txtv.value
            res.innerHTML = `<p> Voce do pais   <strong>${pais}</strong></p>`
              if (pais != 'Brasil'){
                    res.innerHTML += `<p> Voce e <strong>Extrangeiro </strong>Seja bem Vindo! </p>`
                }

                else{
                          res.innerHTML += `<p> Voce e <strong>Brasileiro </strong>Seja bem Vindo! </p>`
                }

            

        }
    </script>
</body>
</html>
